[package]
name = "libp2p-webrtc"
version = "0.10.0-alpha"
authors = ["Parity Technologies <admin@parity.io>"]
description = "WebRTC transport for libp2p"
repository = "https://github.com/libp2p/rust-libp2p"
license = "MIT"
edition.workspace = true
rust-version = { workspace = true }
keywords = ["peer-to-peer", "libp2p", "networking"]
categories = ["network-programming", "asynchronous"]

[dependencies]
async-trait = "0.1"
bytes = { workspace = true }
futures = { workspace = true }
futures-timer = { workspace = true }
hex = "0.4"
if-watch = { workspace = true }
libp2p-core = { workspace = true }
libp2p-noise = { workspace = true }
libp2p-identity = { workspace = true }
libp2p-webrtc-utils = { workspace = true }
multihash = { workspace = true }
rand = { workspace = true }
rcgen = "0.14"
rtc = { version = "0.20", optional = true }
stun = "0.17"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net"], optional = true }
tracing = { workspace = true }
webrtc = { version = "0.20", default-features = false, features = ["runtime-tokio"], optional = true }

[features]
tokio = ["dep:rtc", "dep:tokio", "dep:webrtc", "if-watch/tokio"]
pem = ["rtc?/pem"]

[dev-dependencies]
libp2p-identity = { workspace = true, features = ["rand"] }
tokio = { workspace = true, features = ["full"] }
quickcheck = "1.1"
tracing-subscriber = { workspace = true, features = ["env-filter"] }


[[test]]
name = "smoke"
required-features = ["tokio"]

[lints]
workspace = true

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true
